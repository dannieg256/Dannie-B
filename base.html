<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title or "Kalshi 9-Agent Dashboard" }}</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; margin: 0; background:#0b0d12; color:#f5f7fb; }
    .wrap { max-width: 900px; margin:auto; padding:16px; }
    .card { background:#151922; border:1px solid #2b3240; border-radius:16px; padding:16px; margin:12px 0; }
    a { color:#8fc7ff; text-decoration:none; }
    button { width:100%; padding:14px; border:0; border-radius:12px; font-weight:700; font-size:16px; }
    .green { background:#21c67a; color:#07130d; }
    .danger { background:#ff5e67; color:#170406; }
    .muted { color:#9ba5b4; }
    .pill { display:inline-block; padding:5px 9px; border-radius:999px; background:#293041; margin-right:6px; }
    input { width:100%; box-sizing:border-box; padding:13px; border-radius:10px; border:1px solid #384154; background:#0e1118; color:#fff; margin:5px 0 12px; font-size:16px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:10px; }
    .big { font-size:26px; font-weight:800; }
    .warning { background:#392f13; border-color:#6c5a25; }
    code { word-break:break-all; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="big">Kalshi 9-Agent Dashboard</div>
    <span class="pill">{{ env|upper }}</span>
    <span class="pill">{% if live %}LIVE ENABLED{% else %}PAPER MODE{% endif %}</span>
    <div style="margin-top:10px"><a href="/">Markets</a> · <a href="/portfolio">Portfolio</a></div>
  </div>
  {% block content %}{% endblock %}
</div>
</body>
</html>
